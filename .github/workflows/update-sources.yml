name: Update sources

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Probe source domains
        run: node scripts/check-sources.mjs

      - name: Commit if changed
        run: |
          git config user.name "smtv-bot"
          git config user.email "bot@smtv.local"
          git add sources.json
          if git diff --cached --quiet; then
            echo "Degisiklik yok."
          else
            git commit -m "chore: update active sources [skip ci]"
            git push
          fi
