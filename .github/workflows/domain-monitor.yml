name: domain-monitor

on:
  schedule:
    - cron: "23 */6 * * *"   # 6 saatte bir
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: domain-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kurulum
        run: pip install curl_cffi

      - name: Domain taramasi
        run: python scripts/domain_monitor.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add domains.json
          if git diff --cached --quiet; then
            echo "Degisiklik yok."
            exit 0
          fi
          git commit -m "Update domains.json from domain-monitor [skip ci]"
          git push
